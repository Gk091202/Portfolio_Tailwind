<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeGlassDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="cubeGlassLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.15" />
    </linearGradient>
    
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.25"/>
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      @keyframes rotate3d {
        0% { transform: rotateX(20deg) rotateY(0deg) rotateZ(5deg); }
        100% { transform: rotateX(20deg) rotateY(360deg) rotateZ(5deg); }
      }
      @keyframes orbit1 {
        0% { transform: translate(0, 0) rotateZ(0deg); }
        100% { transform: translate(0, 0) rotateZ(360deg); }
      }
      @keyframes orbit2 {
        0% { transform: translate(0, 0) rotateZ(0deg); }
        100% { transform: translate(0, 0) rotateZ(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .cube { animation: rotate3d 20s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .orbit-container { transform-origin: 300px 250px; }
      .orbit-1 { animation: orbit1 25s linear infinite; }
      .orbit-2 { animation: orbit2 30s linear infinite; }
      .neon-pulse { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background ambient glow -->
  <circle cx="300" cy="250" r="280" fill="url(#badgeGrad)" opacity="0.03" />
  <circle cx="300" cy="250" r="200" fill="url(#accentGrad)" opacity="0.02" />

  <!-- Central Content Authority Cube -->
  <g class="float" filter="url(#shadow)">
    <!-- Outer cube frame with glassmorphism -->
    <g class="cube">
      <!-- Back face layers -->
      <rect x="150" y="150" width="300" height="300" rx="20" fill="url(#cubeGlassDark)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5" opacity="0.4"/>
      
      <!-- Middle layer 1 -->
      <g opacity="0.5">
        <rect x="160" y="160" width="280" height="280" rx="18" fill="url(#cubeGlassLight)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
      </g>
      
      <!-- Front face with content cards inside -->
      <g opacity="0.7">
        <!-- Layer content - Search snippets -->
        <rect x="170" y="170" width="260" height="260" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(168,85,247,0.4)" stroke-width="2"/>
        
        <!-- Content card 1 -->
        <rect x="190" y="190" width="220" height="45" rx="8" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
        <text x="200" y="208" font-family="system-ui" font-size="9" fill="#94a3b8">ideal ac temperature</text>
        <text x="200" y="222" font-family="system-ui" font-size="8" fill="#64748b">Rank #1 • Page 1</text>
        
        <!-- Content card 2 -->
        <rect x="190" y="245" width="220" height="45" rx="8" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
        <text x="200" y="263" font-family="system-ui" font-size="9" fill="#94a3b8">ac modes explained</text>
        <text x="200" y="277" font-family="system-ui" font-size="8" fill="#64748b">Rank #2 • Featured</text>
        
        <!-- Content card 3 -->
        <rect x="190" y="300" width="220" height="45" rx="8" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
        <text x="200" y="318" font-family="system-ui" font-size="9" fill="#94a3b8">ac power consumption</text>
        <text x="200" y="332" font-family="system-ui" font-size="8" fill="#64748b">Rank #3 • Page 1</text>
        
        <!-- AI Overview badge inside cube -->
        <g filter="url(#innerGlow)">
          <rect x="190" y="355" width="220" height="35" rx="8" fill="rgba(168,85,247,0.15)" stroke="url(#badgeGrad)" stroke-width="1.5"/>
          <circle cx="205" cy="373" r="3" fill="#a855f7" class="neon-pulse"/>
          <text x="220" y="377" font-family="system-ui" font-size="10" font-weight="600" fill="#a855f7">AI Overview</text>
          <text x="335" y="377" font-family="system-ui" font-size="10" fill="#64748b">85%</text>
        </g>
      </g>
    </g>

    <!-- Data pathway lines connecting cube to badges -->
    <g opacity="0.4" stroke-width="1.5" stroke="url(#accentGrad)" fill="none" stroke-dasharray="4,4">
      <path d="M 300 150 L 380 80" stroke-linecap="round"/>
      <path d="M 450 250 L 500 200" stroke-linecap="round"/>
      <path d="M 300 450 L 380 520" stroke-linecap="round"/>
      <path d="M 150 250 L 100 200" stroke-linecap="round"/>
      <path d="M 200 150 L 120 80" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Premium Badges - Orbit Layer 1 -->
  <g class="orbit-container">
    <g class="orbit-1">
      <!-- Rank #1 Badge -->
      <g transform="translate(420, 100)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="80" height="50" rx="12" fill="url(#badgeGrad)" opacity="0.95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <text x="40" y="32" font-family="system-ui" font-size="24" font-weight="800" fill="white" text-anchor="middle">#1</text>
          <text x="40" y="48" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">RANK</text>
        </g>
      </g>

      <!-- First Page Badge -->
      <g transform="translate(450, 320)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="90" height="50" rx="12" fill="url(#accentGrad)" opacity="0.9" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <text x="45" y="18" font-family="system-ui" font-size="10" font-weight="600" fill="white" text-anchor="middle">FIRST</text>
          <text x="45" y="38" font-family="system-ui" font-size="10" font-weight="600" fill="white" text-anchor="middle">PAGE</text>
        </g>
      </g>

      <!-- AI Overview Badge -->
      <g transform="translate(380, 520)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="85" height="50" rx="12" fill="rgba(168,85,247,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <circle cx="12" cy="25" r="3" fill="#06b6d4" class="neon-pulse"/>
          <text x="45" y="18" font-family="system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle">AI</text>
          <text x="45" y="35" font-family="system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle">OVERVIEW</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating Premium Badges - Orbit Layer 2 -->
  <g class="orbit-container">
    <g class="orbit-2">
      <!-- Rank #2 Badge -->
      <g transform="translate(100, 280)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="80" height="50" rx="12" fill="rgba(168,85,247,0.85)" opacity="0.95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <text x="40" y="32" font-family="system-ui" font-size="24" font-weight="800" fill="white" text-anchor="middle">#2</text>
          <text x="40" y="48" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">RANK</text>
        </g>
      </g>

      <!-- Rank #3 Badge -->
      <g transform="translate(150, 70)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="80" height="50" rx="12" fill="rgba(6,182,212,0.85)" opacity="0.95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <text x="40" y="32" font-family="system-ui" font-size="24" font-weight="800" fill="white" text-anchor="middle">#3</text>
          <text x="40" y="48" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">RANK</text>
        </g>
      </g>

      <!-- Top 4 Badge -->
      <g transform="translate(200, 520)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="90" height="50" rx="12" fill="rgba(59,130,246,0.85)" opacity="0.95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <text x="45" y="22" font-family="system-ui" font-size="11" font-weight="700" fill="white" text-anchor="middle">TOP</text>
          <text x="45" y="40" font-family="system-ui" font-size="11" font-weight="700" fill="white" text-anchor="middle">4</text>
        </g>
      </g>

      <!-- Organic Growth Badge -->
      <g transform="translate(320, 570)">
        <g filter="url(#softGlow)">
          <rect x="0" y="0" width="100" height="50" rx="12" fill="rgba(6,182,212,0.8)" opacity="0.9" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <polyline points="15,35 25,25 35,30 45,15 55,25 65,10" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <text x="75" y="38" font-family="system-ui" font-size="9" font-weight="600" fill="white">+24%</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Inner glowing core -->
  <g filter="url(#softGlow)">
    <circle cx="300" cy="250" r="120" fill="url(#badgeGrad)" opacity="0.08"/>
    <circle cx="300" cy="250" r="110" fill="url(#accentGrad)" opacity="0.05"/>
  </g>

  <!-- Subtle corner accent lights -->
  <g opacity="0.15">
    <circle cx="50" cy="80" r="80" fill="url(#badgeGrad)" filter="url(#softGlow)"/>
    <circle cx="550" cy="600" r="100" fill="url(#accentGrad)" filter="url(#softGlow)"/>
  </g>

  <!-- Neon accent points around cube -->
  <g opacity="0.6" filter="url(#softGlow)">
    <circle cx="320" cy="140" r="3" fill="#a855f7"/>
    <circle cx="460" cy="250" r="2.5" fill="#06b6d4"/>
    <circle cx="320" cy="360" r="3" fill="#06b6d4"/>
    <circle cx="140" cy="250" r="2.5" fill="#a855f7"/>
    <circle cx="240" cy="130" r="2" fill="#f59e0b"/>
    <circle cx="360" cy="350" r="2" fill="#ec4899"/>
  </g>
</svg>
